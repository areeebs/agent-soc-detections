[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-soc-detections"
version = "0.1.0"
description = "Local SOC triage for normalized AI-agent and MCP tool-call events"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ahmed Areeb" }]
dependencies = []

[project.scripts]
agent-soc = "agent_soc:main"

[tool.setuptools]
py-modules = ["agent_soc"]
